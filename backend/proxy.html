<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>CORS Proxy PPM1</title></head>
<body>
<!-- GitHub Pages CORS Proxy untuk PPM1 -->
<script>
// Proses request dari query parameter ?action=&session=&logType=
// Return JSON dari backend Apps Script
const API_BACKEND = 'https://script.google.com/macros/s/AKfycbzY6dKbnSn0lbIEAfal2078XzbcbQcShlGWE4Jt7IkxkWP8RaCxyBH7xykVFeRHzpMVLA/exec';
const params = new URLSearchParams(location.search);
const action = params.get('action') || 'items';
const session = params.get('session') || '';
const logType = params.get('logType') || '';

async function run() {
  const target = `${API_BACKEND}?action=${encodeURIComponent(action)}&session=${encodeURIComponent(session)}${logType ? `&logType=${encodeURIComponent(logType)}` : ''}`;
  try {
    const r = await fetch(target, { redirect: 'follow' });
    const text = await r.text();
    let json;
    try { json = JSON.parse(text); } catch { json = { raw: text }; }
    document.body.innerHTML = '';
    const pre = document.createElement('pre');
    pre.style.cssText = 'font-family:monospace;padding:1rem;background:#111;color:#0f0';
    pre.textContent = JSON.stringify(json, null, 2);
    document.body.appendChild(pre);
  } catch (e) {
    document.body.innerHTML = `<pre style="color:red;padding:1rem">${e.message}</pre>`;
  }
}
run();
</script>
</body></html>
